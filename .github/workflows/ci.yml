name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install jwt-cli
      run: |
        set -euo pipefail
        if ! command -v jwt >/dev/null 2>&1; then
          brew install mike-engel/jwt-cli/jwt-cli
        fi

