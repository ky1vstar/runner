name: CI

# The nonce lets a driver find the exact run it dispatched by title.
run-name: "runner ${{ inputs.runs-on }} ${{ inputs.nonce }}"

on:
  workflow_dispatch:
    inputs:
      runs-on:
        required: true
        type: choice
        options: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
      nonce:
        required: false
        default: ""

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}

    steps:
    - uses: actions/checkout@v7

    - name: Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:gh-runner

    - name: Setup upterm session
      id: upterm
      uses: owenthereal/action-upterm@v2
      with:
        upterm-server: ssh://upterm:22
        known-hosts: ${{ secrets.UPTERM_KNOWN_HOSTS }}
        detached: true
        wait-timeout-minutes: 10

    # Logs of an in-progress job are not downloadable; an artifact is.
    - name: Publish ssh command
      shell: bash
      env:
        SSH_COMMAND: ${{ steps.upterm.outputs.ssh-command }}
      run: printf '%s\n' "$SSH_COMMAND" > ssh-command.txt

    - uses: actions/upload-artifact@v4
      with:
        name: ssh-command
        path: ssh-command.txt
