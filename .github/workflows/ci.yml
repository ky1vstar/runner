name: CI

# The nonce lets a driver find the exact run it dispatched by title.
run-name: "runner ${{ inputs.runs-on }} ${{ inputs.nonce }}"

on:
  workflow_dispatch:
    inputs:
      runs-on:
        required: true
        type: choice
        options: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
      nonce:
        required: false
        default: ""

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}

    steps:
    - uses: actions/checkout@v7

    - name: Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:gh-runner

    # MagicDNS does not reach the OS resolver on every runner (windows-11-arm), so dial by IP.
    - name: Resolve upterm relay
      id: relay
      shell: bash
      env:
        KNOWN_HOSTS: ${{ secrets.UPTERM_KNOWN_HOSTS }}
      run: |
        for i in $(seq 1 30); do
          ip=$(tailscale ip -4 upterm 2>/dev/null | head -1) && [ -n "$ip" ] && break
          sleep 2
        done
        [ -n "$ip" ] || { echo "::error::cannot resolve upterm via tailscale"; exit 1; }
        echo "server=ssh://$ip:22" >> "$GITHUB_OUTPUT"
        {
          echo 'known-hosts<<KH_EOF'
          printf '%s\n' "$KNOWN_HOSTS" | awk -v ip="$ip" '
            /^[[:space:]]*(#|$)/ { print; next }
            /^@/ { $2 = $2 "," ip; print; next }
            { $1 = $1 "," ip; print }'
          echo 'KH_EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Setup upterm session
      id: upterm
      uses: owenthereal/action-upterm@v2
      with:
        upterm-server: ${{ steps.relay.outputs.server }}
        known-hosts: ${{ steps.relay.outputs.known-hosts }}
        detached: true
        wait-timeout-minutes: 10

    # Logs of an in-progress job are not downloadable; an artifact is.
    - name: Publish ssh command
      shell: bash
      env:
        SSH_COMMAND: ${{ steps.upterm.outputs.ssh-command }}
      run: printf '%s\n' "$SSH_COMMAND" > ssh-command.txt

    - uses: actions/upload-artifact@v4
      with:
        name: ssh-command
        path: ssh-command.txt
