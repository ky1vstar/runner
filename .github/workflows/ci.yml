name: CI

on:
  workflow_dispatch:
    inputs:
      runs-on:
        required: true
        type: choice
        options: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm, macos-latest]

jobs:
  test:
    runs-on: ${{ inputs.runs-on }}

    steps:
    - uses: actions/checkout@v7

    - name: Tailscale
      uses: tailscale/github-action@v4
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:gh-runner

    - name: Setup upterm session
      uses: owenthereal/action-upterm@v2
      with:
        upterm-server: ssh://upterm:22
        known-hosts: ${{ secrets.UPTERM_KNOWN_HOSTS }}
        limit-access-to-actor: true
